const SAMPLE_BUNDLE = { graph: SAMPLE, course: SAMPLE_COURSE, findings: SAMPLE_FINDINGS, asiSnapshot: SAMPLE_ASI, sources: SAMPLE_SOURCES };

/* ---- Bundle adapter: accept a raw AtlasGraph or a full AtlasBundle. -------- */
function normalize(input){
  const graph = input && input.graph ? input.graph : input;
  if(!graph || !Array.isArray(graph.nodes) || !Array.isArray(graph.edges))
    throw new Error("Not an Atlas graph: expected { nodes:[], edges:[] }");
  const label = (input && input.repository && input.repository.label)
    || (input && input.product && input.product.name) || null;
  const name = (input && input.product && input.product.name) || null;
  const course = (input && input.course) || null;
  const findings = (input && input.findings) || null;
  const asi = (input && input.asiSnapshot) || null;
  const overlay = (input && input.threatOverlay) || null;
  const sources = (input && input.sources) || null;
  return { graph, label, productName:name, course, findings, asi, overlay, sources, revision:(input&&input.repository&&input.repository.revision)||graph.revision||"" };
}

const KIND_COLOR = k => k==="file" ? css("--file") : css("--func");
const EDGE_COLOR = { contains:"--k-contains", imports:"--k-imports", calls:"--k-calls" };
function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

const state = {
  graph:null, byId:new Map(), nbr:new Map(), selected:null,
  mode:"architecture", filters:{contains:true,imports:true,calls:true}, isSample:true,
  detail:"full", expanded:new Set(), shownNodes:0,   // bounded-loading: file-level collapse for large graphs
  course:null, lessons:new Map(), completed:new Set(),
  findingByNode:new Map(), blast:new Set(), asi:null, hasFindings:false, sources:new Map(),
  overlay:null, leadsByNode:new Map(), leadFiles:new Set(), showUnresolved:false, cappedLeadsPage:0
};
// Collapse to a file-level view automatically once the full graph gets big
// enough that rendering/simulating every node would lag.
const COLLAPSE_THRESHOLD = 600;
// Hard upper bound on nodes sent to the force simulation, so neither thousands of
// files nor one huge expanded file can flood it. Nodes beyond this are withheld
// from the draw (still in the bundle + search), highest-degree kept first.
const MAX_RENDER = 1200;

const GRADECSS = { red:"--grade-red", lead:"--grade-lead", yellow:"--grade-yellow", green:"--grade-green", control:"--grade-control", gray:"--grade-gray" };
const VERIFIED = g => g==="OBSERVED" || g==="TESTED";
function gradeOf(nodeId){
  const f = state.findingByNode.get(nodeId);
  const n = state.byId.get(nodeId);
  const collapsedFile = !!(n && n.kind==="file" && state.detail==="files" && !state.expanded.has(nodeId));
  // For a COLLAPSED file, a hidden member weakness must win over a direct control
  // finding on the file — otherwise a control mapped to the file could mask a
  // weakness in one of its hidden functions. Rank weakness severity (direct or
  // aggregated) first; only then fall back to a direct control / blast / gray.
  if(collapsedFile){
    const direct = f && f.kind==="weakness" ? (VERIFIED(f.grade) ? "red" : "lead") : null;
    const member = (state.worstByFile && state.worstByFile.get(nodeId)) || null;
    if(direct==="red" || member==="red") return "red";
    if(direct==="lead" || member==="lead") return "lead";
    if(f && f.kind==="control") return VERIFIED(f.grade) ? "green" : "control";  // same evidence gate as the full view
    if(state.blast.has(nodeId)) return "yellow";
    return "gray";
  }
  if(f){
    // green = control VERIFIED effective (OBSERVED/TESTED); control = control present but
    // unverified (STATIC/INFERRED) — a muted green, never the full hardened colour.
    if(f.kind==="control") return VERIFIED(f.grade) ? "green" : "control";
    return VERIFIED(f.grade) ? "red" : "lead";   // red = verified weakness; lead = unverified static match
  }
  if(state.blast.has(nodeId)) return "yellow";
  return "gray";
}
/* ---- Threat overlay: external leads (hypotheses) resolved onto this graph. ----
   Leads never feed the Security grades; they only mark nodes in the Threat Map view. */
function buildOverlay(overlay){
  state.overlay = overlay && Array.isArray(overlay.leads) ? overlay : null;
  state.leadsByNode = new Map(); state.leadFiles = new Set(); state.leadFileOf = new Map(); state.showUnresolved = false; state.showCappedLeads = false; state.cappedLeadsPage = 0;
  if(!state.overlay) return;
  for(const l of state.overlay.leads){
    if(!state.byId.has(l.nodeId)) continue;   // a lead for a node not in this graph is ignored, never drawn
    if(!state.leadsByNode.has(l.nodeId)) state.leadsByNode.set(l.nodeId, []);
    state.leadsByNode.get(l.nodeId).push(l);
    const nb = state.nbr && state.nbr.get(l.nodeId);
    const fileId = nb && nb.container ? nb.container : (state.byId.get(l.nodeId).kind==="file" ? l.nodeId : null);
    if(fileId){ state.leadFiles.add(fileId); state.leadFileOf.set(l.nodeId, fileId); }
  }
}
function leadOn(id){
  if(state.leadsByNode.has(id)) return true;
  const n = state.byId.get(id);   // a collapsed file stands in for the functions it hides
  return !!(n && n.kind==="file" && state.detail==="files" && !state.expanded.has(id) && state.leadFiles.has(id));
}
/* Resolved leads the render cap dropped — neither the lead's own node nor its containing file is
   currently drawn, so nothing in the 3D view stands in for it (collapsed-file stand-in included).
   Bounded itself: this is a list to click through, not a second unbounded render. */
const CAPPED_LEADS_SHOWN = 30;
function cappedLeadIds(){
  if(!state.leadsByNode || !state.drawn) return [];
  const out = [];
  for(const id of state.leadsByNode.keys()){
    if(state.drawn.has(id)) continue;
    const fileId = state.leadFileOf && state.leadFileOf.get(id);
    // A drawn containing file only stands in for its hidden functions' leads under the SAME
    // condition leadOn() uses (collapsed, "files" detail, not individually expanded) — in Full
    // detail, or once the file is expanded, a drawn file no longer represents them visually, so
    // treating it as covered here would make those leads uncolored AND undiscoverable.
    const fileStandsIn = fileId && state.drawn.has(fileId) && state.detail==="files" && !state.expanded.has(fileId);
    if(fileStandsIn) continue;
    out.push(id);
  }
  return out;
}
const DISMISSED = f => f.disposition && f.disposition.status==="false_positive";
const ACCEPTED  = f => f.disposition && f.disposition.status==="accepted_risk";
function buildFindings(findings){
  state.findingByNode=new Map(); state.blast=new Set(); state.dismissedByNode=new Map(); state.worstByFile=new Map();
  state.hasFindings = Array.isArray(findings) && findings.length>0;
  const fileOfNode = id => { const n=state.nbr&&state.nbr.get(id); return (n&&n.container) ? n.container : (state.byId.get(id)&&state.byId.get(id).kind==="file" ? id : null); };
  const bump = (fileId, color) => { // keep the most severe weakness colour per file (red > lead)
    if(!fileId) return; const cur=state.worstByFile.get(fileId);
    if(color==="red" || (color==="lead" && cur!=="red")) state.worstByFile.set(fileId,color);
  };
  for(const f of (findings||[])){
    if(DISMISSED(f)){ // a false positive no longer colours its node; keep it for the panel
      for(const ref of f.nodeRefs) if(!state.dismissedByNode.has(ref)) state.dismissedByNode.set(ref,f);
      continue;
    }
    for(const ref of f.nodeRefs) if(!state.findingByNode.has(ref)) state.findingByNode.set(ref,f);
    // Only a VERIFIED weakness that was not accepted casts a blast radius; a static
    // lead — or a triaged-away finding — propagates nothing.
    if(f.kind==="weakness" && VERIFIED(f.grade) && !ACCEPTED(f)) (f.blastRadius||[]).forEach(id=>state.blast.add(id));
    // Aggregate member weaknesses up to the file, so collapsing to the file view
    // never HIDES a weakness in a now-hidden function.
    if(f.kind==="weakness") for(const ref of f.nodeRefs) bump(fileOfNode(ref), VERIFIED(f.grade)?"red":"lead");
  }
}
function asiClass(id){ return (state.asi&&state.asi.classes||[]).find(c=>c.id===id); }

function doneKey(){ return "atlas-done:"+(state.graph&&state.graph.revision||"g"); }
function loadDone(){ try{ const r=localStorage.getItem(doneKey()); state.completed=new Set(r?JSON.parse(r):[]); }catch{ state.completed=new Set(); } }
function saveDone(){ try{ localStorage.setItem(doneKey(),JSON.stringify([...state.completed])); }catch{} }

/* ---- Exploration: what the person has opened, kept in this browser -------------
   This is UI state. It is never written into findings, never changes a grade, and a
   visit or bookmark proves nothing about the code.
     visited  = the component was opened     reviewed = the person marked it
   (Tested / verified belong to evidence and are not set here.) Records are keyed by
   path + kind + name, so they survive a rebuild; a record also keeps the content hash
   it was opened at, and a component whose content has since changed counts as unexplored again. */
function exploreKey(n){ return ((n.evidence&&n.evidence.path)||"") + "::" + n.kind + "::" + n.label; }
function exploreStatus(rec, n){
  if(!rec || !rec.t) return "unvisited";
  const h = n.evidence && n.evidence.contentHash;
  if(rec.h && h && rec.h!==h) return "changed";
  return rec.r ? "reviewed" : "visited";
}
/* nearest component (breadth-first over the given neighbours) that is still unexplored */
function nextUnexplored(startId, nbrOf, isUnexplored, limit){
  const seen = new Set([startId]); let level = [startId];
  while(level.length && seen.size < (limit||5000)){
    const next = [];
    for(const id of level) for(const t of nbrOf(id)) if(!seen.has(t)){ seen.add(t); if(isUnexplored(t)) return t; next.push(t); }
    level = next;
  }
  return null;
}
function mixHex(a, b, t){   // a moved toward b by t; #rrggbb only, anything else comes back unchanged
  const parse = h => /^#[0-9a-f]{6}$/i.test(h) ? [1,3,5].map(i=>parseInt(h.slice(i,i+2),16)) : null;
  const x = parse(a), y = parse(b); if(!x || !y) return a;
  return "#" + x.map((v,i)=>Math.round(v+(y[i]-v)*t).toString(16).padStart(2,"0")).join("");
}

const EXPLORE_RECENT_MAX = 40;
const explore = { items:{}, recent:[], fog:true };
function exploreStoreKey(){ return "atlas-explore:v1:" + (state.exploreProject || "g"); }
function loadExplore(){
  explore.items = {}; explore.recent = []; explore.fog = true;
  try{
    const r = JSON.parse(localStorage.getItem(exploreStoreKey()) || "null");
    if(r && typeof r==="object"){
      if(r.items && typeof r.items==="object") explore.items = r.items;
      if(Array.isArray(r.recent)) explore.recent = r.recent.filter(k=>typeof k==="string").slice(0,EXPLORE_RECENT_MAX);
      if(r.fog===false) explore.fog = false;
    }
  }catch{}
}
let exploreSaveTimer = 0;
function saveExplore(){
  clearTimeout(exploreSaveTimer);
  exploreSaveTimer = setTimeout(()=>{
    try{ localStorage.setItem(exploreStoreKey(), JSON.stringify({ items:explore.items, recent:explore.recent, fog:explore.fog })); }catch{}
  }, 250);
}
function exploreStat(id){ const n = state.byId.get(id); return n ? exploreStatus(explore.items[exploreKey(n)], n) : "unvisited"; }
const isUnexplored = id => { const s = exploreStat(id); return s==="unvisited" || s==="changed"; };
function markVisited(n){
  const k = exploreKey(n);
  const r = explore.items[k] || (explore.items[k] = {});
  const h = (n.evidence && n.evidence.contentHash) || "";
  if(r.h && h && r.h!==h) r.r = 0;           // the code changed since it was reviewed: that review no longer applies
  r.t = Date.now(); r.h = h;
  explore.recent = [k, ...explore.recent.filter(x=>x!==k)].slice(0, EXPLORE_RECENT_MAX);
  saveExplore();
}
function exploreFlag(n, flag){   // "r" reviewed | "b" bookmarked
  const k = exploreKey(n);
  const r = explore.items[k] || (explore.items[k] = {});
  r[flag] = r[flag] ? 0 : Date.now();
  saveExplore();
}
function indexExploreKeys(){
  state.byExploreKey = new Map();
  for(const n of state.graph.nodes){ const k = exploreKey(n); if(!state.byExploreKey.has(k)) state.byExploreKey.set(k, n.id); }
}
/* nodes that must stay drawn even when the render cap withholds low-degree nodes */
function pinnedIds(){
  const s = new Set(); if(state.selected) s.add(state.selected);
  const add = k => { const id = state.byExploreKey && state.byExploreKey.get(k); if(id) s.add(id); };
  explore.recent.slice(0,30).forEach(add);
  for(const k in explore.items) if(explore.items[k].b) add(k);
  // In Threat Map, a lead must stay discoverable even on a repo big enough to hit the render
  // cap: a resolved lead with nothing pinning its node/file is otherwise silently dropped by
  // collapseForDetail's degree ranking, with no list view to find it in afterward.
  if(state.mode==="threatmap" && state.leadsByNode){
    for(const id of state.leadsByNode.keys()) s.add(id);
    if(state.leadFiles) for(const id of state.leadFiles) s.add(id);
  }
  return s;
}
function fogged(id, base){
  if(!explore.fog) return base;
  const s = exploreStat(id);
  return (s==="visited" || s==="reviewed") ? mixHex(base, css("--bg"), s==="reviewed" ? 0.7 : 0.5) : base;
}
function exploredCount(){
  let n = 0;
  for(const k in explore.items){ const id = state.byExploreKey && state.byExploreKey.get(k); if(id && !isUnexplored(id)) n++; }
  return n;
}
function updateExploreChip(){
  const lbl = document.getElementById("exploreLbl"); if(!lbl || !state.graph) return;
  lbl.textContent = `Explored ${exploredCount().toLocaleString()} / ${state.graph.nodes.length.toLocaleString()}`;
}
function statLine(n){
  const rec = explore.items[exploreKey(n)], s = exploreStatus(rec, n);
  const when = rec && rec.t ? new Date(rec.t).toLocaleString() : "";
  const text = s==="reviewed" ? `Marked reviewed by you (first opened ${when}).`
    : s==="visited" ? `Opened ${when}. Not marked reviewed.`
    : s==="changed" ? `Changed since you last opened it (${when}).`
    : "Not opened before.";
  return text + " Opening or bookmarking something does not verify it.";
}
function copyText(text, btn){
  const done = ok => { if(!btn) return; const old = btn.dataset.l || btn.textContent; btn.dataset.l = old; btn.textContent = ok ? "Copied ✓" : "Copy failed"; setTimeout(()=>{ btn.textContent = old; }, 1400); };
  const fallback = () => {
    try{
      const ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly","");
      ta.style.cssText = "position:fixed;left:-9999px;top:0"; document.body.appendChild(ta); ta.select();
      const ok = document.execCommand("copy"); ta.remove(); done(ok);
    }catch{ done(false); }
  };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(()=>done(true), fallback);
  else fallback();
}
function renderExplorePanel(){
  const el = document.getElementById("xpanel"); if(!el || !state.graph) return;
  const row = (id, tag) => {
    const n = state.byId.get(id); if(!n) return "";
    return `<button class="xitem" data-goto="${esc(id)}"><span>${esc(n.label)}</span><span class="xp">${esc((n.evidence&&n.evidence.path)||"")}</span><span class="xs">${tag}</span></button>`;
  };
  const idOf = k => state.byExploreKey.get(k);
  const marks = Object.keys(explore.items).filter(k=>explore.items[k].b && idOf(k));
  const recent = explore.recent.filter(k=>idOf(k)).slice(0,15);
  el.innerHTML = `
    <div class="xrow"><button class="btn" id="xNext">Next unexplored →</button>
      <label class="ev-toggle"><input type="checkbox" id="xFog" ${explore.fog?"checked":""}> Dim opened</label></div>
    <h3>Bookmarks</h3>${marks.length ? marks.map(k=>row(idOf(k),"★")).join("") : `<div class="xempty">None yet. Use ☆ Bookmark in the inspector.</div>`}
    <h3>Recently opened</h3>${recent.length ? recent.map(k=>{ const s=exploreStat(idOf(k)); return row(idOf(k), s==="changed"?"changed":s==="reviewed"?"reviewed":"opened"); }).join("") : `<div class="xempty">Nothing opened yet.</div>`}
    <p class="xnote">Opened = you clicked it. Reviewed = you marked it. Neither is evidence; tested and verified claims live in findings. Saved in this browser, per project; not part of the bundle.
    Dimming is off in the Security view so grade colours stay exact.</p>
    <div class="xrow" style="margin-top:10px"><button class="btn" id="xClear">Clear history</button></div>`;
  el.querySelectorAll("[data-goto]").forEach(b=>b.addEventListener("click",()=>goTo(b.getAttribute("data-goto"))));
  document.getElementById("xNext").addEventListener("click",goNextUnexplored);
  document.getElementById("xFog").addEventListener("change",ev=>{ explore.fog = ev.target.checked; saveExplore(); refreshColors(); });
  document.getElementById("xClear").addEventListener("click",()=>{
    if(!confirm("Forget everything you have opened, reviewed and bookmarked in this project?")) return;
    explore.items = {}; explore.recent = []; saveExplore(); refreshColors(); renderExplorePanel();
    if(state.selected) openInspector(state.selected);
  });
}
function goNextUnexplored(){
  let target = state.selected ? nextUnexplored(state.selected, neighborsOf, isUnexplored) : null;
  if(!target){   // nothing connected is left: take the best-connected unexplored file
    let best = -1;
    for(const n of state.graph.nodes){
      if(n.kind!=="file" || !isUnexplored(n.id)) continue;
      const nb = state.nbr.get(n.id); const d = nb ? nb.importsIn.length + nb.importsOut.length + nb.contains.length : 0;
      if(d > best){ best = d; target = n.id; }
    }
  }
  if(target) goTo(target);
}
/* Move to a component from anywhere (links, search, history): make it drawn, select it, then fly to it. */
function goTo(id){
  if(!state.byId.has(id)) return;
  const wasDrawn = state.drawn && state.drawn.has(id);
  ensureVisible(id);
  openInspector(id);
  // Clicking a row in the "not drawn" panel pin-rescues that node (openInspector's render()
  // branch, since wasDrawn was false going in), which changes state.drawn — refresh the legend
  // so the panel drops the now-visible node and its count, instead of going stale until some
  // unrelated action rebuilds it.
  updateLegend();
  setTimeout(()=>focusNode(id), wasDrawn ? 0 : 900);   // a newly drawn node has no position until the layout settles
}

let FG = null;

function indexGraph(g){
  state.byId = new Map(g.nodes.map(n=>[n.id,n]));
  const nbr = new Map(g.nodes.map(n=>[n.id,{callsOut:[],callsIn:[],importsOut:[],importsIn:[],contains:[],container:null,inf:new Set()}]));
  for(const e of g.edges){
    if(!nbr.has(e.from)||!nbr.has(e.to)) continue;
    if(e.kind==="calls"){
      nbr.get(e.from).callsOut.push(e.to); nbr.get(e.to).callsIn.push(e.from);
      // record name-inferred calls so the inspector can mark them as not-proven
      if(e.confidence==="inferred"){ nbr.get(e.from).inf.add(e.to); nbr.get(e.to).inf.add(e.from); }
    }
    else if(e.kind==="imports"){ nbr.get(e.from).importsOut.push(e.to); nbr.get(e.to).importsIn.push(e.from); }
    else if(e.kind==="contains"){ nbr.get(e.from).contains.push(e.to); nbr.get(e.to).container=e.from; }
  }
  state.nbr = nbr;
}

// Bounded loading: collapse function/class/constant nodes into their file so a
// large repo renders as a small FILE graph instead of thousands of nodes. A
// hidden node's edges are remapped to its file (intra-file self-loops dropped,
// duplicates aggregated). detail==="full" renders everything; a file id in
// `expanded` shows that one file's members even while the rest stay collapsed.
// Pure (no globals) so it is unit-testable.
function collapseForDetail(nodes, edges, opts){
  const { detail, expanded, containerOf, filters, cap, pinned } = opts;
  const fileIds = new Set(nodes.filter(n=>n.kind==="file").map(n=>n.id));
  const fileOf = id => fileIds.has(id) ? id : (containerOf.get(id) || id);
  let visNodes = nodes.filter(n => detail==="full" || n.kind==="file" || expanded.has(fileOf(n.id)));

  // Hard node cap: even collapsed, a repo with thousands of files (or one huge
  // expanded file) can still flood the force simulation. When over `cap`, keep
  // the highest-degree nodes (the structural hubs) and drop the rest; the dropped
  // nodes stay in the bundle + search, they're just not drawn. `capped` reports
  // how many were withheld so the UI can say so.
  let capped = 0;
  const beforeCap = visNodes;
  if(cap && visNodes.length > cap){
    const deg = new Map();
    const inc = id => deg.set(id, (deg.get(id)||0)+1);
    for(const e of edges){ const a=fileOf(e.from), b=fileOf(e.to); inc(a); inc(b); }
    // files first (they are the scaffold of the collapsed view), then by degree
    const ranked = [...visNodes].sort((x,y)=>
      (x.kind==="file"?0:1)-(y.kind==="file"?0:1) || (deg.get(y.id)||0)-(deg.get(x.id)||0));
    capped = visNodes.length - cap;
    visNodes = ranked.slice(0, cap);
    if(pinned && pinned.size){            // what the person selected, bookmarked or recently opened stays drawn
      const have = new Set(visNodes.map(n=>n.id));
      const byId = new Map(beforeCap.map(n=>[n.id,n]));
      // Pinning can RESCUE a capped node, but only up to a bounded overflow: a pinned set driven
      // by untrusted data (Threat Map pins every lead-bearing node/file, and an overlay can spread
      // leads across thousands of files) must not be able to defeat `cap` and flood the simulation.
      // Past this budget a pinned node just stays capped like any other — still searchable, still
      // counted in `capped` so the UI's "withheld" note stays honest. Iterating `pinned` itself
      // (not `beforeCap`) and in ITS insertion order matters: pinnedIds() adds state.selected
      // first, so clicking a capped lead to bring it into view always wins the budget over the
      // (much larger, lower-priority) bulk of Threat Map lead pins added after it.
      const PIN_OVERFLOW = 300;
      let added = 0;
      for(const id of pinned){
        if(added >= PIN_OVERFLOW) break;
        if(have.has(id)) continue;
        const n = byId.get(id); if(!n) continue;
        visNodes.push(n); capped--; added++; have.add(id);
      }
    }
  }
  const visSet = new Set(visNodes.map(n=>n.id));
  const linkMap = new Map();
  for(const e of edges){
    if(filters && filters[e.kind]===false) continue;
    const from = visSet.has(e.from) ? e.from : fileOf(e.from);
    const to   = visSet.has(e.to)   ? e.to   : fileOf(e.to);
    if(!visSet.has(from) || !visSet.has(to)) continue;   // endpoint not drawn (hidden or capped)
    if(from===to) continue;                               // collapsed intra-file edge
    const aggregated = (from!==e.from) || (to!==e.to);
    const key = from+"|"+to+"|"+e.kind;
    if(!linkMap.has(key)) linkMap.set(key, { source:from, target:to, kind:e.kind, id:key, confidence: aggregated?undefined:e.confidence, aggregated });
  }
  return { nodes: visNodes, links: [...linkMap.values()], capped };
}

function fgData(){
  const g = state.graph;
  const containerOf = new Map();
  for(const [id,nb] of (state.nbr||new Map())) if(nb.container) containerOf.set(id, nb.container);
  const { nodes:vn, links, capped } = collapseForDetail(g.nodes, g.edges, { detail: state.detail, expanded: state.expanded, containerOf, filters: state.filters, cap: MAX_RENDER, pinned: pinnedIds() });
  // reuse the previous node objects so a rebuild keeps their positions instead of restarting the layout
  const prev = state.nodeObjs || new Map();
  const nodes = vn.filter(n=>state.byId.has(n.id)).map(n=>{
    const o = prev.get(n.id); if(o){ o.ref = n; return o; }
    return { id:n.id, kind:n.kind, label:n.label, ref:n };
  });
  state.nodeObjs = new Map(nodes.map(o=>[o.id,o]));
  state.drawn = new Set(state.nodeObjs.keys());
  const linkOut = links.filter(l=>state.byId.has(l.source)&&state.byId.has(l.target));
  state.shownNodes = nodes.length; state.capped = capped;
  return { nodes, links: linkOut };
}

function nodeColor(node){
  if(state.mode==="threatmap"){
    if(state.selected===node.id) return css("--accent");
    // mixHex (a real colour), not dim(): the 3D engine cannot parse a CSS color-mix() string and would paint the node black
    return leadOn(node.id) ? css("--lead-ext") : mixHex(KIND_COLOR(node.kind), css("--bg"), 0.55);
  }
  if(state.mode==="security") return css(state.hasFindings ? GRADECSS[gradeOf(node.id)] : "--grade-gray");
  if(state.mode==="learn" && state.selected){
    const near = neighborsOf(state.selected);
    if(node.id!==state.selected && !near.has(node.id)) return dim(KIND_COLOR(node.kind));
  }
  if(state.selected===node.id) return css("--accent");
  return fogged(node.id, KIND_COLOR(node.kind));
}
function linkColor(link){
  // Security view: nodes carry the security colours, so lines stay neutral. Otherwise the green of a
  // "calls" line reads as a security result (it is the same green as a hardened control).
  if(state.mode==="security") return css("--k-contains");
  const base = css(EDGE_COLOR[link.kind]||"--edge");
  if(state.mode==="learn" && state.selected){
    const s = srcId(link.source), t = srcId(link.target);
    if(s!==state.selected && t!==state.selected) return dim(base);
  }
  // name-inferred calls render MUTED (the bundled renderer has no line-dash API),
  // so an unproven edge is visually subordinate to a resolved one.
  if(link.confidence==="inferred") return "color-mix(in srgb,"+base+" 45%, transparent)";
  return base;
}
function dim(hex){ // fade a hex color toward the background for the "Learn" focus effect
  return "color-mix(in srgb,"+hex+" 22%, transparent)";
}
function srcId(x){ return typeof x==="object" ? x.id : x; }

function neighborsOf(id){
  const n = state.nbr.get(id); const s = new Set();
  if(!n) return s;
  [...n.callsOut,...n.callsIn,...n.importsOut,...n.importsIn,...n.contains].forEach(x=>s.add(x));
  if(n.container) s.add(n.container);
  return s;
}

/* Structural change (detail level, filters, load, a node that was not drawn): rebuild the graph data. */
function render(){
  const d = fgData();
  FG.graphData(d);
  FG.nodeColor(n=>nodeColor(n)).linkColor(l=>linkColor(l));
  syncDetailBtn();
  updateExploreChip();
}
/* Selection / mode / theme / history changed: recolour only. Rebuilding the data would restart the layout. */
function refreshColors(){
  FG.nodeColor(n=>nodeColor(n)).linkColor(l=>linkColor(l));
  updateExploreChip();
}

/* Fit the connected structure; a few unlinked nodes drift far out and would otherwise shrink everything. */
function fitView(){
  FG.zoomToFit(600, 80, n=>{
    const nb = state.nbr.get(n.id); if(!nb) return true;
    return nb.callsOut.length + nb.callsIn.length + nb.importsOut.length + nb.importsIn.length + nb.contains.length > 0 || !!nb.container;
  });
}

function syncDetailBtn(){
  const btn = document.getElementById("detailBtn"); if(!btn) return;
  const lbl = document.getElementById("detailLbl");
  const total = state.graph ? state.graph.nodes.length : 0;
  if(lbl) lbl.textContent = (state.detail==="full" ? "Full" : "Files") + ` · ${state.shownNodes}/${total}` + (state.capped ? ` (+${state.capped} capped)` : "");
  btn.setAttribute("aria-pressed", String(state.detail==="files"));
  btn.title = (state.detail==="files"
    ? "Collapsed to files for a fast view — click a file to reveal its functions, or switch to Full."
    : "Showing every node. Switch to Files for a fast, bounded view of a large repo.")
    + (state.capped ? ` ${state.capped} node(s) withheld from the draw (still searchable) to keep the view responsive.` : "");
}
function toggleDetail(){
  state.detail = state.detail==="files" ? "full" : "files";
  if(state.detail==="files") state.expanded = new Set();   // start fully collapsed
  render();
  // cappedLeadIds()/leadOn() both read state.detail and state.drawn (set by the render() above)
  // to decide whether a collapsed file stands in for its hidden functions' leads — switching
  // Files<->Full changes that answer for every lead-bearing file, so the legend's capped-lead
  // count and any open panel need to refresh here too, same as every other render path that can
  // change what counts as "drawn".
  updateLegend();
}

/* ---- Inspector: plain-language DEFAULT, evidence BEHIND a toggle. --------- */
function labelFor(id){ const n=state.byId.get(id); return n?n.label:id; }

function plainText(n){
  const nb = state.nbr.get(n.id)||{};
  if(n.kind==="file"){
    const fns = (nb.contains||[]).length;
    const imp = (nb.importsOut||[]).length, impBy=(nb.importsIn||[]).length;
    let s = `This is a source file`;
    s += fns ? ` holding ${fns} function${fns===1?"":"s"}.` : `.`;
    if(imp||impBy){
      s += ` It imports ${imp} file${imp===1?"":"s"} and is imported by ${impBy}.`;
    }
    return s;
  }
  const cin=(nb.callsIn||[]).length, cout=(nb.callsOut||[]).length;
  const where = nb.container ? ` in ${labelFor(nb.container)}` : "";
  let s = `This is a function${where}.`;
  if(cin||cout){
    s += ` It is called by ${cin} place${cin===1?"":"s"} and calls ${cout} other function${cout===1?"":"s"}.`;
    // name-inferred calls are counted, but never stated as proven
    const inf = nb.inf || new Set();
    const ninf = [...(nb.callsIn||[]), ...(nb.callsOut||[])].filter(id=>inf.has(id)).length;
    if(ninf) s += ninf===cin+cout ? ` These calls are matched by name only, not proven.` : ` ${ninf} of these calls are matched by name only, not proven.`;
  }
  else s += ` No call relationships were resolved for it.`;
  return s;
}
function roleText(n){
  const nb = state.nbr.get(n.id)||{};
  if(n.kind==="function" && (nb.callsIn||[]).length===0 && nb.container)
    return "No resolved callers — it may be an entry point, a callback, or called dynamically (which static analysis cannot see).";
  if(n.kind==="file" && (nb.importsIn||[]).length===0)
    return "Nothing in the analysed graph imports this file — it may be an entry point.";
  return "";
}

function connRows(n){
  const nb = state.nbr.get(n.id)||{};
  const inf = nb.inf || new Set();
  const row = (lab, ids, markInferred)=> ids && ids.length
    ? `<div class="conn-row"><span class="lab">${lab}</span><span class="vals">${
        ids.map(id=>`<b data-goto="${esc(id)}">${esc(labelFor(id))}</b>${markInferred&&inf.has(id)?`<span class="inf" title="Name-based match — a real call site to the only definition of this name, but not proven to be the callee.">inferred</span>`:""}`).join(", ")}</span></div>` : "";
  let out = "";
  if(n.kind==="file"){
    out += row("contains", nb.contains);
    out += row("imports", nb.importsOut);
    out += row("imported by", nb.importsIn);
  }else{
    if(nb.container) out += row("in file", [nb.container]);
    out += row("called by", nb.callsIn, true);
    out += row("calls", nb.callsOut, true);
  }
  return out || `<div class="conn-row"><span class="vals" style="color:var(--fg-faint)">No resolved connections.</span></div>`;
}

function evidenceGrid(n){
  const e = n.evidence||{};
  const rows = [
    ["path", e.path], ["line", e.line], ["column", e.column],
    ["revision", e.revision], ["hash", e.contentHash],
    ["method", e.method], ["status", e.status],
  ].filter(r=>r[1]!==undefined && r[1]!==null);
  return rows.map(([k,v])=>`<div><span class="ek">${k}</span><span class="ev">${esc(String(v))}</span></div>`).join("");
}

function openInspector(id){
  const n = state.byId.get(id); if(!n) return;
  const wasDrawn = state.drawn && state.drawn.has(id);
  state.selected = id;
  markVisited(n);
  const insp = document.getElementById("inspector");
  document.getElementById("inspKind").textContent = (n.kind==="file"?"SOURCE FILE":"FUNCTION")+" · SOURCE RECORD";
  document.getElementById("inspTitle").textContent = n.label;
  const dot = document.getElementById("inspDot");
  dot.style.background = state.mode==="security"
    ? css(state.hasFindings ? GRADECSS[gradeOf(n.id)] : "--grade-gray")
    : (state.mode==="threatmap" && leadOn(n.id) ? css("--lead-ext") : KIND_COLOR(n.kind));

  const security = state.mode==="security";
  const threatmap = state.mode==="threatmap";
  const role = roleText(n);
  const body = `
    <p class="plain">${esc(plainText(n))}</p>
    ${role?`<p class="role">${esc(role)}</p>`:""}
    ${exploreBar(n)}
    <div class="connects"><h3>Connected components</h3>${connRows(n)}</div>
    ${sourceSection(n)}
    ${security?securitySection(n):""}
    ${threatmap?threatMapSection(n):""}
    <div class="lessons"><h3>Course</h3><div id="lessonSlot"></div></div>
    <div class="evidence" id="evidence">
      <div class="ev-toggle" id="evToggle" role="button" tabindex="0" aria-expanded="false">
        <span class="caret">▶</span> Show evidence (source provenance)
      </div>
      <div class="ev-grid">${evidenceGrid(n)}</div>
    </div>`;
  const bodyEl = document.getElementById("inspBody");
  bodyEl.innerHTML = body;
  insp.classList.add("open");

  bodyEl.querySelectorAll("[data-goto]").forEach(b=>b.addEventListener("click",()=>goTo(b.getAttribute("data-goto"))));
  renderLesson(n.id);
  wireSource();
  wireExploreBar(n);

  const evWrap=document.getElementById("evidence"), evTog=document.getElementById("evToggle");
  const toggle=()=>{ const open=evWrap.classList.toggle("open"); evTog.setAttribute("aria-expanded",open); };
  evTog.addEventListener("click",toggle);
  evTog.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle();} });

  if(wasDrawn) refreshColors(); else render();   // a node the cap had withheld is drawn now (it is pinned)
  if(!document.getElementById("xpanel").hidden) renderExplorePanel();
}
function exploreBar(n){
  const rec = explore.items[exploreKey(n)] || {};
  return `<div class="xbar"><span class="xstat">${esc(statLine(n))}</span>
    <button class="btn" data-x="bookmark" aria-pressed="${rec.b?"true":"false"}">${rec.b?"★ Bookmarked":"☆ Bookmark"}</button>
    <button class="btn" data-x="review" aria-pressed="${exploreStatus(rec,n)==="reviewed"?"true":"false"}">✓ Mark reviewed</button>
    <button class="btn" data-x="next">Next unexplored →</button></div>`;
}
function wireExploreBar(n){
  document.querySelectorAll("#inspBody [data-x]").forEach(b=>b.addEventListener("click",()=>{
    const what = b.getAttribute("data-x");
    if(what==="next"){ goNextUnexplored(); return; }
    exploreFlag(n, what==="bookmark" ? "b" : "r");
    openInspector(n.id);
  }));
}
function closeInspector(){ state.selected=null; document.getElementById("inspector").classList.remove("open"); refreshColors(); }

/* ---- Source section: the actual code for the selected node, line-tagged ---*/
function sourceSection(n){
  const code = state.sources.get(n.evidence.path);
  if(!code) return "";
  const lines = code.split("\n");
  const target = n.evidence.line||1;
  if(target > lines.length){
    const why = state.truncatedSources && state.truncatedSources.has(n.evidence.path)
      ? `this file was truncated at build time and only its first ${lines.length} lines are embedded`
      : `the embedded source has only ${lines.length} lines`;
    return `<p class="role">Source for line ${target} is not available in this bundle: ${esc(why)}. Open ${esc(n.evidence.path)} in your editor.</p>`;
  }
  let start, end;
  if(n.kind==="function"){ start=Math.max(1,target-1); end=Math.min(lines.length, start+48); }
  else { start=1; end=Math.min(lines.length, 200); }
  const rows = lines.slice(start-1,end).map((ln,i)=>{
    const no=start+i, hot=no===target;
    return `<div class="src-line${hot?' hot':''}"><span class="src-no">${no}</span><span class="src-code">${esc(ln)||" "}</span></div>`;
  }).join("");
  const more = end<lines.length ? `<div class="src-more">… ${lines.length-end} more lines</div>` : "";
  const truncated = !!(state.truncatedSources && state.truncatedSources.has(n.evidence.path));
  state.copyPayload = { excerpt: lines.slice(start-1,end).join("\n"), path: n.evidence.path + ":" + target, plainPath: n.evidence.path, file: truncated ? null : code };
  const meta = `<div class="src-meta${truncated?" warn":""}">lines ${start}–${end} of ${lines.length}${truncated?" · this file was cut at build time: the full file is not in the bundle":""}</div>`;
  const actions = `<div class="src-actions"><button class="btn" data-copy="excerpt">Copy shown lines</button>
    <button class="btn" data-copy="path">Copy path:line</button>
    <button class="btn" data-copy="file" ${truncated?'disabled title="Not available: only part of this file is embedded"':''}>Copy full file</button></div>`;
  const f = state.findingByNode.get(n.id);
  const tag = (state.mode==="security" && f) ? `<span class="src-tag" style="background:var(${GRADECSS[gradeOf(n.id)]})">${f.kind==="control"?"CONTROL":f.grade}</span>` : "";
  return `<div class="srcwrap" id="srcwrap">
    <div class="src-toggle" id="srcToggle" role="button" tabindex="0" aria-expanded="false">
      <span class="caret">▶</span> View source <span class="src-path">${esc(n.evidence.path)}:${target}</span> ${tag}
    </div>
    <div class="src">${meta}${actions}<div class="src-inner">${rows}${more}</div></div></div>`;
}
function wireSource(){
  const wrap=document.getElementById("srcwrap"); if(!wrap) return;
  const tog=document.getElementById("srcToggle");
  const toggle=()=>{ const open=wrap.classList.toggle("open"); tog.setAttribute("aria-expanded",open);
    if(open){ const hot=wrap.querySelector(".src-line.hot"); if(hot) hot.scrollIntoView({block:"center"}); } };
  tog.addEventListener("click",toggle);
  tog.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle();} });
  wrap.querySelectorAll("[data-copy]").forEach(b=>b.addEventListener("click",()=>{
    const c = state.copyPayload; if(!c) return;
    const what = b.getAttribute("data-copy");
    const text = what==="excerpt" ? c.excerpt : what==="path" ? c.path : c.file;
    if(text!=null) copyText(text, b);
  }));
}

/* ---- Security section: color-graded finding + ASI context + live link -----*/
const GRADE_LABEL = { red:"WEAKNESS (VERIFIED)", lead:"UNVERIFIED LEAD", yellow:"POSSIBLY AFFECTED", green:"HARDENED CONTROL", control:"CONTROL (UNVERIFIED)", gray:"UNASSESSED" };
function asiStamp(){
  if(!state.asi) return "";
  return `<p class="asi-stamp">ASI ${esc(state.asi.revision)} · snapshot as of ${esc(state.asi.asOf)} · the live link is the source of truth.</p>`;
}
/* Only http(s) links render as links; anything else (javascript:, data:, …) is
   neutralized so a crafted bundle url cannot execute on click. */
function safeUrl(u){
  try{ const p = new URL(u, location.href); return (p.protocol==="http:"||p.protocol==="https:") ? p.href : null; }
  catch{ return null; }
}
function asiLink(ref){
  if(!ref) return "";
  const cls = asiClass(ref.id);
  const mit = cls ? `<p class="asi-mit">${esc(cls.mitigation)}</p>` : "";
  const href = safeUrl(ref.url);
  const link = href
    ? `<a class="asi-a" href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(ref.label)} ↗</a>`
    : `<span class="asi-a">${esc(ref.label)}</span>`;
  return `<div class="asi"><span class="asi-id">${esc(ref.id)}</span> ${link}${mit}</div>`;
}
const DISP_LABEL = { confirmed:"Confirmed", false_positive:"False positive", accepted_risk:"Accepted risk" };
function dispositionNote(f){
  const d = f && f.disposition; if(!d) return "";
  const when = (d.at||"").slice(0,10);
  const who = esc(d.by||"?");
  const note = d.note ? ` — ${esc(d.note)}` : "";
  return `<p class="sec-note disp"><b>Triaged: ${esc(DISP_LABEL[d.status]||d.status)}</b> by ${who}${when?` on ${esc(when)}`:""}${note}. A triage decision is a human/agent call; it does not change how the finding was verified.</p>`;
}
function securitySection(n){
  if(!state.hasFindings){
    return `<div class="note security"><b>Unassessed.</b> No validated security findings are attached to this graph, so every component is grey. A dependency link alone does not establish that a weakness here can reach anything else.</div>`;
  }
  const f = state.findingByNode.get(n.id);
  const g = gradeOf(n.id);
  if(f){
    // Only a VERIFIED weakness that was not accepted shows a "may affect" list — never
    // trust a raw radius on a static/inferred lead (a loaded third-party bundle may
    // carry one), or the panel would contradict its own "casts no blast radius" note.
    const affected = (f.kind==="weakness" && VERIFIED(f.grade) && !ACCEPTED(f) && f.blastRadius && f.blastRadius.length)
      ? `<div class="conn-row"><span class="lab">may affect</span><span class="vals">${f.blastRadius.map(id=>`<b data-goto="${esc(id)}">${esc(labelFor(id))}</b>`).join(", ")}</span></div>` : "";
    return `<div class="sec">
      <div class="sec-head"><span class="grade-pill" style="background:var(${GRADECSS[g]})">${GRADE_LABEL[g]}</span><span class="grade-ev">${esc(f.grade)}</span></div>
      <p class="sec-title">${esc(f.title)}</p>
      <p class="sec-expl">${esc(f.explanation)}</p>
      ${affected}
      ${asiLink(f.asiRef)}
      ${f.kind==="weakness"
        ? (g==="lead"
            ? `<p class="sec-note">Unverified static lead — a pattern match, <b>not</b> a confirmed weakness, and it casts no blast radius. Verify it (reproduce at runtime) before acting; only OBSERVED/TESTED findings mark components as possibly-affected.</p>`
            : `<p class="sec-note">Verified weakness. ${(f.blastRadius&&f.blastRadius.length&&!ACCEPTED(f))?"The affected components are shown as possibly-affected, not proven paths.":""}</p>`)
        : (g==="green"
            ? `<p class="sec-note">Verified control — evaluated against the stated threat. Hardened does not mean universally safe.</p>`
            : `<p class="sec-note">Control <b>present but unverified</b> — the artifact was found statically, not confirmed effective. A reviewer must verify it actually guards the relevant surface before relying on it.</p>`)}
      ${dispositionNote(f)}
      ${asiStamp()}</div>`;
  }
  // A dismissed DIRECT finding shows the gray DISMISSED panel — but only when the
  // node is not ALSO in the blast radius of a different, still-active weakness. If
  // it is, the node is coloured yellow, so fall through to POSSIBLY AFFECTED rather
  // than hiding that live warning behind the dismissed finding.
  const dismissed = state.dismissedByNode && state.dismissedByNode.get(n.id);
  if(dismissed && !state.blast.has(n.id)){
    return `<div class="sec"><div class="sec-head"><span class="grade-pill" style="background:var(--grade-gray)">DISMISSED</span><span class="grade-ev">was ${esc(dismissed.grade)}</span></div>
      <p class="sec-title">${esc(dismissed.title)}</p>
      <p class="sec-expl">Triaged as a false positive, so it no longer colours this component or casts a blast radius.</p>
      ${dispositionNote(dismissed)}${asiStamp()}</div>`;
  }
  if(state.blast.has(n.id)){
    return `<div class="sec"><div class="sec-head"><span class="grade-pill" style="background:var(--grade-yellow)">POSSIBLY AFFECTED</span></div>
      <p class="sec-expl">In the blast radius of a finding elsewhere. A dependency link does not establish that the weakness can actually reach this component — investigation warranted.</p>${asiStamp()}</div>`;
  }
  return `<div class="note security"><b>No finding on this component.</b> It was not flagged by the attached findings. Absence of a finding is not proof of safety.</div>`;
}

/* ---- Threat Map: external leads on this component ------------------------*/
const LEAD_LABEL = { hypothetical:"HYPOTHETICAL LEAD", inferred:"INFERRED LEAD", observed:"REPORTED OBSERVED", verified:"REPORTED VERIFIED", refuted:"REFUTED" };
// A lead's url is untrusted overlay text and can contain an unpaired UTF-16 surrogate (e.g. an
// isolated \ud800) — syntactically a valid JS string, but encodeURI() THROWS on it (URIError:
// URI malformed). The scheme check alone doesn't catch this, so without the try/catch a single
// malformed url would abort rendering of the whole lead card/inspector, not just the link.
function safeHref(u){ if(!/^https?:\/\//i.test(u||"")) return null; try{ return encodeURI(u); }catch(e){ return null; } }
const EVIDENCE_ROWS_SHOWN = 20;
const LEAD_CARDS_SHOWN = 30;
const MEMBER_LEADS_SHOWN = 30;
const UNRESOLVED_ROWS_SHOWN = 50;
const UNRESOLVED_TEXT_CAP = 300;
const LEAD_TEXT_CAP = 300;
/* The viewer renders the raw bundle JSON, not an MCP tool response, so none of the server-side
   field caps (boundLeadText/boundUnresolvedEntry in tools.ts) apply here — a valid overlay can
   still carry a multi-hundred-KB description on one unresolved entry. Cap it client-side too. */
function clip(s, n){ s = String(s||""); return s.length > n ? s.slice(0, n) + "…" : s; }
function leadCard(l){
  // l.url is unclipped overlay text — safeHref() only checks the scheme and then runs the WHOLE
  // value through encodeURI() into the href attribute, so an oversized url would still produce
  // oversized markup. Clipping it the way every other field is clipped (append "…" to a prefix)
  // would navigate somewhere ELSE entirely while still looking like the source's own link — worse
  // than no link. So an oversized url is omitted as a link outright; only one within the safe
  // bound is ever turned into an href.
  const href = (l.url && String(l.url).length <= LEAD_TEXT_CAP) ? safeHref(l.url) : null;
  // The overlay document cap (5MB/5,000 entries) bounds the WHOLE document, not evidence items on
  // ONE lead — a valid sub-5MB overlay could still put tens of thousands of tiny records here.
  // Mapping an unbounded array into <li>s synchronously on open would stall/freeze the inspector.
  const evItems = l.evidence || [];
  // Row/card counts (EVIDENCE_ROWS_SHOWN, LEAD_CARDS_SHOWN) bound how many items render, not how
  // long any ONE field is — a valid overlay can still put most of its 5MB document budget into a
  // single lead's note/label/rule or one evidence item's source/detail. Clip every text field too.
  const ev = evItems.slice(0, EVIDENCE_ROWS_SHOWN).map(e=>`<li><b>${esc(clip(e.source, LEAD_TEXT_CAP))}</b> ${esc(clip(e.detail, LEAD_TEXT_CAP))}</li>`).join("")
    + (evItems.length > EVIDENCE_ROWS_SHOWN ? `<li>+ ${evItems.length - EVIDENCE_ROWS_SHOWN} more evidence item(s) not shown</li>` : "");
  const untested = (l.status==="hypothetical"||l.status==="inferred") ? `<p class="sec-note"><b>Still needs testing:</b> nothing here has reproduced this. Trace the call path above and confirm at runtime before treating it as a finding.</p>` : "";
  return `<div class="lead-card ${l.status==="refuted"?"refuted":""}">
    <div class="sec-head"><span class="lead-pill">${esc(LEAD_LABEL[l.status]||l.status)}</span><span class="grade-ev">${esc(l.confidence)} confidence</span></div>
    <p class="sec-title">${esc(clip(l.attackClassId, LEAD_TEXT_CAP))} · ${href?`<a class="asi-a" href="${href}" target="_blank" rel="noopener">${esc(clip(l.label, LEAD_TEXT_CAP))} ↗</a>`:esc(clip(l.label, LEAD_TEXT_CAP))}</p>
    <p class="sec-expl">${esc(clip(l.note, LEAD_TEXT_CAP))}</p>
    ${l.rule?`<p class="sec-note">Mapping rule: <code>${esc(clip(l.rule, LEAD_TEXT_CAP))}</code></p>`:""}
    ${ev?`<ul class="sec-note">${ev}</ul>`:""}
    ${untested}</div>`;
}
function threatMapSection(n){
  const o = state.overlay;
  if(!o){
    return `<div class="note security"><b>No threat overlay attached.</b> Nothing in this view is assessed. Build with <code>--asi-overlay</code> to attach external leads; see docs/threat-overlay.md.</div>`;
  }
  const own = state.leadsByNode.get(n.id) || [];
  const members = n.kind==="file" ? [...state.leadsByNode.entries()].filter(([id])=>{ const nb=state.nbr.get(id); return nb && nb.container===n.id; }) : [];
  // source.identity/ref/asOf are untrusted overlay text like everything else here (up to the
  // 5MB document limit on any one field) — this stamp renders on EVERY component in Threat Map
  // mode, including one with no leads, so it needs the same clip the per-lead fields already get.
  const stamp = `<p class="asi-stamp">Source: ${esc(clip(o.source.identity, LEAD_TEXT_CAP))} @ ${esc(clip(o.source.ref, LEAD_TEXT_CAP))} · as of ${esc(clip(o.source.asOf, LEAD_TEXT_CAP))}. A lead is a hypothesis to investigate, not proof of a vulnerability.</p>`;
  if(!own.length && !members.length){
    return `<div class="note security"><b>No lead on this component.</b> The overlay source reported nothing here. Absence of a lead is not proof of safety.</div>${stamp}`;
  }
  // Leads can resolve to thousands of distinct functions inside one file; LEAD_CARDS_SHOWN only
  // bounds leads attached to the file itself, so this member list needs its own cap.
  const shownMembers = members.slice(0, MEMBER_LEADS_SHOWN);
  const memberOverflow = members.length > MEMBER_LEADS_SHOWN
    ? `, + ${members.length - MEMBER_LEADS_SHOWN} more function(s) with leads not shown` : "";
  const memberRows = members.length
    ? `<div class="conn-row"><span class="lab">leads in this file</span><span class="vals">${shownMembers.map(([id,ls])=>`<b data-goto="${esc(id)}">${esc(labelFor(id))}</b> (${ls.length})`).join(", ")}${memberOverflow}</span></div>` : "";
  // The overlay schema permits up to 5,000 leads total, and nothing stops them all landing on
  // one node — render only the first LEAD_CARDS_SHOWN as full cards so opening such a node can't
  // synchronously build tens of thousands of DOM elements and freeze the inspector.
  const shown = own.slice(0, LEAD_CARDS_SHOWN);
  const overflowNote = own.length > LEAD_CARDS_SHOWN
    ? `<p class="sec-note">+ ${own.length - LEAD_CARDS_SHOWN} more lead(s) on this component not shown.</p>` : "";
  return `<div class="sec">${shown.map(leadCard).join("")}${overflowNote}${memberRows}${stamp}</div>`;
}
function unresolvedPanel(){
  const o = state.overlay; if(!o || !state.showUnresolved) return "";
  const all = o.unresolved||[];
  // The overlay cap allows up to 5,000 unresolved entries, and one entry's description can run
  // to most of the 5MB document limit on its own — bound both the row count and each row's text
  // so opening this panel can't build an unbounded innerHTML assignment.
  const rows = all.slice(0, UNRESOLVED_ROWS_SHOWN).map(u=>`<div class="row"><code>${esc(clip(u.attackClassId, UNRESOLVED_TEXT_CAP))}</code> · ${esc(clip(u.description, UNRESOLVED_TEXT_CAP))}<br><span style="color:var(--fg-faint)">${u.target?`target <code>${esc(clip(u.target, UNRESOLVED_TEXT_CAP))}</code> · `:""}${esc(clip(u.reason, UNRESOLVED_TEXT_CAP))}</span></div>`).join("");
  const overflow = all.length > UNRESOLVED_ROWS_SHOWN ? `<p>+ ${all.length - UNRESOLVED_ROWS_SHOWN} more unresolved entry(ies) not shown.</p>` : "";
  return `<div class="tm-panel" role="region" aria-label="Unresolved leads"><h3>Unresolved (${all.length})</h3><p>These could not be placed on exactly one component of this graph. They are unknown, not cleared.</p>${rows||"<p>None.</p>"}${overflow}</div>`;
}
/* A resolved lead the render cap dropped is otherwise invisible in the 3D view with no way to
   find it (the gap Codex flagged after the pin-overflow cap was added). This list is the find-it
   path: bounded itself (CAPPED_LEADS_SHOWN per page) so a huge overlay can't turn the fix into the
   bug. Zoom/search alone can't reach a node outside the render cap (zooming doesn't change the
   capped set, and search requires already knowing the omitted node's name) — so beyond the first
   page this paginates with Prev/Next instead of just naming a dead-end workaround. */
function cappedLeadsPanel(){
  if(!state.showCappedLeads) return "";
  const ids = cappedLeadIds(); if(!ids.length) return "";
  const pageCount = Math.max(1, Math.ceil(ids.length / CAPPED_LEADS_SHOWN));
  const page = Math.min(Math.max(Math.floor(state.cappedLeadsPage) || 0, 0), pageCount - 1);
  state.cappedLeadsPage = page;   // clamp persists, so a shrinking list (re-render) can't strand the page past its end
  const start = page * CAPPED_LEADS_SHOWN;
  const rows = ids.slice(start, start + CAPPED_LEADS_SHOWN).map(id=>{
    const n = state.byId.get(id); if(!n) return "";
    return `<button class="row" data-goto="${esc(id)}" style="display:block;width:100%;text-align:left;background:none;border:none;cursor:pointer;color:inherit;font:inherit">${esc(n.label)}<br><span style="color:var(--fg-faint)">${esc(n.evidence&&n.evidence.path||"")}</span></button>`;
  }).join("");
  const nav = pageCount > 1 ? `<div class="row" style="display:flex;align-items:center;justify-content:space-between;gap:8px">
    <button data-page-delta="-1" ${page<=0?"disabled":""}>Prev</button>
    <span style="color:var(--fg-faint)">page ${page+1} / ${pageCount}</span>
    <button data-page-delta="1" ${page>=pageCount-1?"disabled":""}>Next</button>
  </div>` : "";
  return `<div class="tm-panel" role="region" aria-label="Leads outside the render cap"><h3>Not currently drawn (${ids.length})</h3><p>The render cap withheld these — click one to bring it into view, or page through the full list below. Absence from the 3D view is not absence of a lead.</p>${rows}${nav}</div>`;
}

/* ---- grounded Break & Fix -------------------------------------------------*/
/* regex checks are NOT executed: a caller-supplied pattern on a learner answer
   is an unbounded backtracking (ReDoS) surface with no safe bound in a standalone
   page, and shape heuristics are provably incomplete (e.g. (a|aa)+$). Generated
   lessons only use includes/excludes, so the regex kind is disabled at runtime. */
function runChecks(code, checks, file){
  const fails=[];
  const body=codeOnly(code, file||"");                               // comments never satisfy a check
  for(const c of (checks||[])){
    if(c.kind==="regex"){ fails.push("Regex checks are disabled in this build for safety."); continue; }
    let ok=true;
    if(c.kind==="includes") ok = body.includes(c.value);
    else if(c.kind==="excludes") ok = !body.includes(c.value);
    if(!ok) fails.push(c.message||"A check did not pass.");
  }
  return fails;
}
/* Mirror of generator.ts `codeOnly` — keep in sync. Strips comments (quote-aware)
   for the language inferred from the lesson's file; unknown language → unchanged. */
function codeOnly(code, file){
  if(!file) return code;
  const hash=/\.(?:py|pyi|rb|rake)$/i.test(file), ruby=/\.(?:rb|rake)$/i.test(file);
  const blank=s=>s.replace(/[^\n]/g,"");
  let out="", quote=null;
  for(let i=0;i<code.length;i++){
    const c=code[i];
    if(c==="\\" && i+1<code.length){ out+=c+code[++i]; continue; }
    if(quote){ out+=c; if(c===quote) quote=null; continue; }
    if(c==='"'||c==="'"||(!hash&&c==="`")){ quote=c; out+=c; continue; }
    if(hash ? c==="#" : (c==="/"&&code[i+1]==="/")){ const nl=code.indexOf("\n",i); if(nl<0) break; i=nl-1; continue; }
    if(!hash && c==="/" && code[i+1]==="*"){ const end=code.indexOf("*/",i+2), stop=end<0?code.length:end+2; out+=blank(code.slice(i,stop)); i=stop-1; continue; }
    if(ruby && c==="=" && (i===0||code[i-1]==="\n") && code.startsWith("=begin",i)){
      const end=code.indexOf("\n=end",i), eol=end<0?-1:code.indexOf("\n",end+1), stop=(end<0||eol<0)?code.length:eol;
      out+=blank(code.slice(i,stop)); i=stop-1; continue;
    }
    out+=c;
  }
  return out;
}
function renderLesson(nodeId){
  const slot=document.getElementById("lessonSlot"); if(!slot) return;
  const lesson=state.lessons.get(nodeId);
  if(!lesson){
    slot.innerHTML=`<p class="role" style="margin-top:0">No lesson attached to this component. Lessons attach by node id when a course bundle is loaded.</p>`;
    return;
  }
  const done=state.completed.has(lesson.id);
  const bf=lesson.breakAndFix;
  slot.innerHTML=`
    <p class="lesson-title">${esc(lesson.title)} ${done?'<span class="done-pill">✓ fixed</span>':''}</p>
    <p class="teach">${esc(lesson.teach)}</p>
    <div class="bf">
      <div class="bf-head"><span class="bf-tag">⚡ Break &amp; Fix</span><span class="bf-file">${esc(bf.file)}</span></div>
      <p class="bf-task">${esc(bf.task)}</p>
      <textarea class="bf-code" id="bfCode" spellcheck="false" aria-label="Editable code to fix"></textarea>
      <div class="bf-actions">
        <button class="btn bf-check" id="bfCheck">Check fix</button>
        <button class="btn" id="bfReset">Reset</button>
        <button class="btn" id="bfSolve">Show fix</button>
      </div>
      <div class="bf-feedback" id="bfFeedback" hidden></div>
      <p class="bf-note">Text check on your code (comments ignored) — it confirms the call or guard is back where it belongs, not that the code runs or behaves correctly.</p>
    </div>`;
  const ta=document.getElementById("bfCode"); ta.value=bf.broken;
  const fb=document.getElementById("bfFeedback");
  document.getElementById("bfReset").addEventListener("click",()=>{ ta.value=bf.broken; fb.hidden=true; });
  document.getElementById("bfSolve").addEventListener("click",()=>{ ta.value=bf.solution; fb.hidden=true; });
  document.getElementById("bfCheck").addEventListener("click",()=>{
    const fails=runChecks(ta.value, bf.checks, bf.file);
    fb.hidden=false;
    if(fails.length===0){
      fb.className="bf-feedback pass";
      fb.innerHTML="✓ Put back together. The structure matches what Atlas expects.";
      state.completed.add(lesson.id); saveDone();
      renderLesson(nodeId);
    }else{
      fb.className="bf-feedback fail";
      fb.innerHTML="Not yet:<ul>"+fails.map(m=>`<li>${esc(m)}</li>`).join("")+"</ul>";
    }
  });
}

// If a target is hidden in the collapsed view (a function in an unexpanded file),
// expand its file first so search results and navigation links can actually
// focus it instead of silently failing.
function ensureVisible(id){
  if(state.detail!=="files") return;
  const n = state.byId.get(id); if(!n || n.kind==="file") return;
  const nb = state.nbr.get(id); const file = nb && nb.container;
  if(file && !state.expanded.has(file)){ state.expanded.add(file); render(); }
}
function focusNode(id){
  ensureVisible(id);
  const d = FG.graphData();
  const node = d.nodes.find(n=>n.id===id); if(!node) return;
  const dist = 90;
  const r = Math.hypot(node.x||0,node.y||0,node.z||0) || 1;
  const k = 1 + dist/r;
  FG.cameraPosition({x:(node.x||0)*k,y:(node.y||0)*k,z:(node.z||0)*k}, node, 900);
}

/* Lessons join to the graph through the schema's `breakAndFix.nodeRef` (where the
   defect lives) and `nodeRefs` (every node the lesson teaches) — the same join the
   MCP server uses. `nodeId` is accepted for older hand-written bundles. The first
   lesson for a node wins, with the defect's own node taking precedence. */
function indexLessons(course){
  const m = new Map();
  const lessons = (course && course.lessons) || [];
  const add = (ref,l)=>{ if(ref && !m.has(ref)) m.set(ref,l); };
  for(const l of lessons){ add(l.breakAndFix && l.breakAndFix.nodeRef, l); add(l.nodeId, l); }
  for(const l of lessons) for(const ref of (l.nodeRefs||[])) add(ref, l);
  return m;
}

/* ---- boot ----------------------------------------------------------------- */
function loadGraph(raw, {sample=false}={}){
  const norm = normalize(raw);
  state.bundle = raw;
  state.graph = norm.graph; state.isSample = sample;
  indexGraph(norm.graph);
  // bounded loading: default a large repo to the collapsed file view so it opens fast
  state.detail = norm.graph.nodes.length > COLLAPSE_THRESHOLD ? "files" : "full";
  state.expanded = new Set();
  state.course = norm.course;
  state.lessons = indexLessons(norm.course);
  state.asi = norm.asi;
  state.sources = new Map(((norm.sources)||[]).map(s=>[s.path,s.code]));
  state.truncatedSources = new Set(((norm.sources)||[]).filter(s=>s.truncated).map(s=>s.path));
  buildFindings(norm.findings);
  buildOverlay(norm.overlay);
  loadDone();
  state.exploreProject = sample ? "sample" : (norm.label || norm.revision || "g");
  state.nodeObjs = null; state.drawn = new Set();
  indexExploreKeys();
  loadExplore();
  const name = norm.productName || PRODUCT.name;
  document.getElementById("brandName").textContent = name;
  document.getElementById("seal").textContent = PRODUCT.seal;
  document.getElementById("brandRev").textContent = norm.label ? norm.label : (norm.revision||"");
  document.getElementById("sampleBadge").hidden = !sample;
  document.getElementById("sampleBadge").style.color = "";
  document.getElementById("sampleBadge").textContent = "Sample graph — open a folder or load a bundle";
  closeInspector();
  render();
  // AFTER render(), not before: updateLegend()'s Threat Map branch reads state.drawn (which
  // render()/fgData() just set for the NEW graph) to list leads the cap dropped. Calling it any
  // earlier would read the PREVIOUS bundle's drawn set — matching none of the new node ids — and
  // misreport every lead as capped. This also re-covers the original bug (a bundle loaded while
  // already in Threat Map mode leaving the legend/unresolved panel on the previous overlay).
  updateLegend();
  const empty = document.getElementById("empty");
  empty.hidden = norm.graph.nodes.length > 0;
  empty.textContent = "No graph nodes found in this project.";
  setTimeout(fitView,400);
}

function showLoadError(message){
  const badge = document.getElementById("sampleBadge");
  badge.hidden = false;
  badge.style.color = "var(--grade-red)";
  badge.textContent = message;
}

const ignoredFolders = new Set(["node_modules", ".git", "dist", "build", ".next", "coverage", ".course", "atlas", ".turbo", "out", "vendor", "__pycache__", ".venv", "venv"]);
const sourceExtension = /\.(?:[cm]?jsx?|tsx?|mts|cts|vue|pyi?|rb|rake)$/;
async function ingestFolder(fileList, token){
  const all = Array.from(fileList);
  if(!all.length) return;
  const name = all[0].webkitRelativePath.split("/")[0];
  const eligible = all.filter(file=>{
    const parts = file.webkitRelativePath.split("/").slice(1);
    return parts.length && !parts.some(p=>ignoredFolders.has(p)) && sourceExtension.test(file.name) && file.size<=200000;
  });
  if(!eligible.length) throw new Error("No supported source files in this folder. Select a JS/TS, Vue, Python, or Ruby project.");
  if(eligible.length>2000) throw new Error("This folder exceeds 2,000 source files. Select a smaller source folder.");
  if(eligible.reduce((total,file)=>total+file.size,0)>24*1024*1024) throw new Error("This folder exceeds 24 MiB of source. Select a smaller source folder.");
  const files = [];
  for(const file of eligible) files.push({path:file.webkitRelativePath.split("/").slice(1).join("/"),code:await file.text()});
  const response = await fetch("/api/build", {
    method:"POST", headers:{"Content-Type":"application/json","X-Atlas-Token":token}, body:JSON.stringify({name,files})
  });
  const result = await response.json();
  if(!response.ok) throw new Error(result.error || "Could not analyze this folder.");
  loadGraph(result);
  const skipped = all.length - eligible.length;
  if(skipped){
    const badge = document.getElementById("sampleBadge");
    badge.hidden=false; badge.style.color="";
    badge.textContent=`Loaded ${eligible.length} source files; skipped ${skipped} excluded, unsupported, or oversized files.`;
  }
}

function buildFG(){
  FG = ForceGraph3D()(document.getElementById("graph"))
    .backgroundColor(css("--bg"))
    .nodeRelSize(5)
    .nodeVal(n=>n.kind==="file"?5:2.2)
    .nodeOpacity(0.95)
    .nodeLabel(n=>`<div style="font:12px/1.4 'IBM Plex Mono',monospace;color:#fff;background:#0b0f14cc;border:1px solid #2a3647;padding:4px 7px;border-radius:6px">
        <b>${esc(n.label)}</b><br><span style="color:#9bb0c3">${n.kind}${state.lessons.has(n.id)?" · 📘 lesson":""}</span></div>`)
    .nodeColor(nodeColor)
    .linkColor(linkColor)
    .linkWidth(l=>l.confidence==="inferred"?0.4:(l.kind==="calls"?0.8:0.5))   // inferred = thinner + muted (no line-dash API in the bundled renderer)
    .linkOpacity(0.5)
    .linkDirectionalArrowLength(l=>l.kind==="contains"?0:3)
    .linkDirectionalArrowRelPos(1)
    .linkDirectionalParticles(l=>state.mode==="learn" && state.selected && (srcId(l.source)===state.selected||srcId(l.target)===state.selected)?2:0)
    .linkDirectionalParticleWidth(1.6)
    .onNodeClick(n=>{
      // bounded loading: clicking a collapsed file reveals just its members
      if(state.detail==="files" && n.kind==="file" && !state.expanded.has(n.id)){ state.expanded.add(n.id); render(); }
      goTo(n.id);
    })
    .onBackgroundClick(()=>closeInspector())
    .warmupTicks(40)
    .cooldownTime(4000);
  FG.d3Force("charge").strength(-120);
}

function applyMode(m){
  state.mode=m;
  document.querySelectorAll(".modes button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.mode===m)));
  // Always render() here, even with a node already selected: pinnedIds() depends on state.mode
  // (Threat Map pins lead nodes/files that other modes don't), so a mode switch changes which
  // nodes the render cap keeps. openInspector()'s wasDrawn-branch shortcut (refreshColors() only,
  // no render()) is for a plain selection change within the SAME mode; calling render() first here
  // means openInspector sees the freshly-rendered node as already drawn and just recolors it,
  // instead of skipping the re-render this mode switch actually needs.
  render();
  if(state.selected) openInspector(state.selected);
  // updateLegend() AFTER render(), same reason as loadGraph: its Threat Map branch reads
  // state.drawn, which render()/fgData() sets. Calling it first would read the drawn set from
  // before this mode switch's pin rescue ran, mislabeling freshly-rescued leads as capped.
  updateLegend();
}
function updateLegend(){
  const el=document.getElementById("legend"); if(!el) return;
  const old = document.getElementById("tmPanel"); if(old) old.remove();
  el.classList.remove("has-controls"); // reset; the threatmap branch below re-adds it if it puts a button here
  if(state.mode==="threatmap"){
    const o = state.overlay;
    const cappedCount = o ? cappedLeadIds().length : 0;
    el.innerHTML = o
      ? `<span><i style="background:var(--file)"></i><b>code structure</b></span>
         <span><i class="sq" style="background:var(--lead-ext)"></i><b>security lead (hypothesis)</b></span>
         <button class="unres-chip" id="unresBtn" aria-expanded="${state.showUnresolved}">unresolved (${(o.unresolved||[]).length})</button>
         ${cappedCount ? `<button class="unres-chip" id="cappedLeadsBtn" aria-expanded="${state.showCappedLeads}">not drawn (${cappedCount})</button>` : ""}`
      : `<span><i class="sq" style="background:var(--grade-gray)"></i><b>no threat overlay attached</b></span>`;
    const btn = document.getElementById("unresBtn");
    if(btn) btn.addEventListener("click",()=>{ state.showUnresolved=!state.showUnresolved; updateLegend(); });
    const cappedBtn = document.getElementById("cappedLeadsBtn");
    if(cappedBtn) cappedBtn.addEventListener("click",()=>{ state.showCappedLeads=!state.showCappedLeads; updateLegend(); });
    // These buttons are the only way to reach leads the render cap hid, on ANY screen size — keep
    // them reachable on mobile even though the rest of the legend stays hidden there (CSS above).
    if(btn || cappedBtn) el.classList.add("has-controls");
    const panels = (o && state.showUnresolved ? unresolvedPanel() : "") + (cappedCount && state.showCappedLeads ? cappedLeadsPanel() : "");
    if(panels){
      const host = document.createElement("div"); host.id="tmPanel"; host.innerHTML = panels;
      host.querySelectorAll("[data-goto]").forEach(b=>b.addEventListener("click",()=>goTo(b.getAttribute("data-goto"))));
      host.querySelectorAll("[data-page-delta]").forEach(b=>b.addEventListener("click",()=>{ state.cappedLeadsPage = (state.cappedLeadsPage||0) + Number(b.getAttribute("data-page-delta")); updateLegend(); }));
      el.parentNode.appendChild(host);
    }
    return;
  }
  if(state.mode==="security"){
    el.innerHTML = state.hasFindings
      ? `<span><i class="sq" style="background:var(--grade-red)"></i><b>weakness</b></span>
         <span><i class="sq" style="background:var(--grade-lead)"></i><b>unverified lead</b></span>
         <span><i class="sq" style="background:var(--grade-yellow)"></i><b>possibly affected</b></span>
         <span><i class="sq" style="background:var(--grade-green)"></i><b>hardened</b></span>
         <span><i class="sq" style="background:var(--grade-control)"></i><b>control (unverified)</b></span>
         <span><i class="sq" style="background:var(--grade-gray)"></i><b>unassessed</b></span>`
      : `<span><i class="sq" style="background:var(--grade-gray)"></i><b>unassessed — no findings attached</b></span>`;
  } else {
    el.innerHTML = `<span><i style="background:var(--file)"></i><b>file</b></span>
      <span><i style="background:var(--func)"></i><b>function</b></span>
      <span><span class="ln" style="border-color:var(--k-contains)"></span><b>contains</b></span>
      <span><span class="ln" style="border-color:var(--k-imports)"></span><b>imports</b></span>
      <span><span class="ln" style="border-color:var(--k-calls)"></span><b>calls</b></span>
      <span><span class="ln" style="border-color:var(--k-calls);opacity:0.45"></span><b>calls (inferred)</b></span>`;
  }
}

function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* reduced motion: stop the gentle auto-settle spin quicker */
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

window.addEventListener("DOMContentLoaded",()=>{
  if(typeof ForceGraph3D!=="function"){
    document.getElementById("empty").hidden=false;
    document.getElementById("empty").textContent="3D engine did not initialize. The renderer is bundled into this file (no network needed); try reopening the viewer.";
    return;
  }
  buildFG();
  if(window.__ATLAS_BUNDLE__) loadGraph(window.__ATLAS_BUNDLE__,{sample:false});
  else loadGraph(SAMPLE_BUNDLE,{sample:true});

  let uploadToken = null;
  try{ uploadToken = JSON.parse(document.getElementById("atlas-upload-config").textContent).token; }catch{}
  const folderBtn = document.getElementById("folderBtn");
  const folder = document.getElementById("folder");
  folderBtn.addEventListener("click",()=>{
    if(!uploadToken){
      showLoadError("To open a folder, run npm start in Code Atlas, then open http://127.0.0.1:4173. This offline viewer accepts saved bundles.");
      return;
    }
    folder.value=""; folder.click();
  });
  folder.addEventListener("change",async()=>{
    if(!folder.files.length) return;
    const empty=document.getElementById("empty");
    folderBtn.disabled=true;
    document.getElementById("loadBtn").disabled=true;
    document.getElementById("downloadBtn").disabled=true;
    empty.textContent="Analyzing folder…"; empty.hidden=false;
    try{ await ingestFolder(folder.files,uploadToken); }
    catch(error){ showLoadError("Could not open folder: "+error.message); }
    finally{
      empty.hidden=!!state.graph?.nodes.length;
      empty.textContent="No graph nodes found in this project.";
      folderBtn.disabled=false;
      document.getElementById("loadBtn").disabled=false;
      document.getElementById("downloadBtn").disabled=false;
      folder.value="";
    }
  });
  document.getElementById("downloadBtn").addEventListener("click",()=>{
    if(!state.bundle) return;
    const url=URL.createObjectURL(new Blob([JSON.stringify(state.bundle,null,2)],{type:"application/json"}));
    const link=document.createElement("a"); link.href=url; link.download="atlas.bundle.json"; link.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  });

  document.getElementById("loadBtn").addEventListener("click",()=>document.getElementById("file").click());
  document.getElementById("file").addEventListener("change",ev=>{
    const f=ev.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{ try{ loadGraph(JSON.parse(r.result),{sample:false}); }
      catch(err){ showLoadError("Could not load: "+err.message); } finally{ ev.target.value=""; } };
    r.onerror=()=>{ showLoadError("Could not read the selected bundle."); ev.target.value=""; };
    r.readAsText(f);
  });
  document.getElementById("fitBtn").addEventListener("click",fitView);
  document.getElementById("inspClose").addEventListener("click",closeInspector);
  document.querySelectorAll(".modes button").forEach(b=>b.addEventListener("click",()=>applyMode(b.dataset.mode)));
  document.querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>{
    const k=c.dataset.kind; if(!k) return;                    // skip non-filter chips (e.g. the detail toggle)
    state.filters[k]=!state.filters[k];
    c.setAttribute("aria-pressed",String(state.filters[k])); render();
  }));
  document.getElementById("detailBtn").addEventListener("click",toggleDetail);
  const search=document.getElementById("search");
  search.addEventListener("keydown",e=>{
    if(e.key!=="Enter") return;
    const q=search.value.trim().toLowerCase(); if(!q) return;
    const hit=state.graph.nodes.find(n=>n.label.toLowerCase().includes(q)||(n.evidence&&n.evidence.path||"").toLowerCase().includes(q));
    if(hit) goTo(hit.id);
  });

  // theme
  const themeBtn=document.getElementById("themeBtn");
  try{ const t=localStorage.getItem("atlas-theme"); if(t==="dark"||t==="electric"||t==="light"){ document.documentElement.setAttribute("data-theme",t); FG.backgroundColor(css("--bg")); } }catch{}
  themeBtn.addEventListener("click",()=>{
    const order=["dark","electric","light"];
    const sysDark=window.matchMedia("(prefers-color-scheme: dark)").matches;
    const cur=document.documentElement.getAttribute("data-theme") || (sysDark?"dark":"light");
    const next = order[(order.indexOf(cur)+1)%order.length];
    document.documentElement.setAttribute("data-theme",next);
    try{ localStorage.setItem("atlas-theme",next); }catch{}
    FG.backgroundColor(css("--bg")); refreshColors();
  });
  document.getElementById("exploreBtn").addEventListener("click",()=>{
    const panel=document.getElementById("xpanel");
    panel.hidden=!panel.hidden;
    if(!panel.hidden) renderExplorePanel();
  });
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{
    if(!document.documentElement.getAttribute("data-theme")){ FG.backgroundColor(css("--bg")); render(); }
  });

  window.addEventListener("resize",()=>{ FG.width(window.innerWidth).height(window.innerHeight); });
});
</script>
