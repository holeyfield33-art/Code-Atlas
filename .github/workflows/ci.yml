name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Don't pile up runs on a branch that's still being pushed to.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install (clean, from lockfile)
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test (record output)
        run: |
          set -o pipefail
          mkdir -p test-records
          npm test 2>&1 | tee "test-records/test-node-${{ matrix.node }}.log"
      - name: Upload test records
        if: always()            # keep the log even when tests fail
        uses: actions/upload-artifact@v4
        with:
          name: test-records-node-${{ matrix.node }}
          path: test-records/
          retention-days: 14
